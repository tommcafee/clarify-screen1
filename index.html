<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clarify Welcome Screen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --navy-deep: #060e1a;
    --navy: #0d1b2e;
    --navy-light: #142841;
    --ink: #eef1f5;
    --ink-dim: rgba(238,241,245,0.55);
    --ink-faint: rgba(238,241,245,0.32);
    --gold: #f5c842;
    --green: #6fae5a;
    --teal: #3a8a8c;
    --hairline: rgba(238,241,245,0.12);
  }

  html, body {
    width: 100%; height: 100%;
    background: var(--navy-deep);
    font-family: 'Roboto Slab', 'Helvetica Neue', Arial, sans-serif;
    overflow: hidden;
    color: var(--ink);
  }

  .stage {
    position: relative;
    width: 100%; height: 100vh;
    background:
      radial-gradient(ellipse 1400px 900px at 18% 8%, rgba(58,138,140,0.16), transparent 60%),
      radial-gradient(ellipse 1200px 800px at 85% 95%, rgba(245,200,66,0.10), transparent 55%),
      linear-gradient(160deg, var(--navy-deep) 0%, var(--navy) 55%, #0a1626 100%);
    overflow: hidden;
  }

  .field { position: absolute; inset: 0; }
  .dot {
    position: absolute;
    border-radius: 50%;
    filter: blur(0.3px);
    animation: drift 26s ease-in-out infinite;
  }
  @keyframes drift {
    0%   { transform: translate(0, 0) scale(1); }
    50%  { transform: translate(14px, -22px) scale(1.08); }
    100% { transform: translate(0, 0) scale(1); }
  }

  .topbar {
    position: absolute;
    top: 64px; left: 72px;
    display: flex;
    align-items: center;
    gap: 22px;
    z-index: 3;
  }
  .topbar img {
    height: 46px;
    width: auto;
  }
  .topbar .divider-v {
    width: 1px; height: 30px;
    background: var(--hairline);
  }
  .topbar .tag {
    font-size: 14px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--ink-faint);
    font-weight: 500;
  }

  .topright {
    position: absolute;
    top: 64px; right: 72px;
    text-align: right;
    z-index: 3;
  }
  .topright .day {
    font-size: 16px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-dim);
    font-weight: 500;
  }
  .topright .dateline {
    font-size: 14px;
    color: var(--ink-faint);
    margin-top: 4px;
    letter-spacing: 0.06em;
  }

  .hero {
    position: relative;
    z-index: 3;
    height: 100%;
    width: 55%;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
    padding-left: 72px;
  }

  /* ── NOTICE PANEL (remove this block when no longer needed) ── */
  .notice-panel {
    position: absolute;
    right: 72px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 3;
    width: 360px;
    background: linear-gradient(160deg, rgba(245,200,66,0.10), rgba(58,138,140,0.07));
    border: 1px solid rgba(245,200,66,0.30);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 0 50px rgba(245,200,66,0.10), 0 12px 32px rgba(0,0,0,0.3);
  }
  .notice-panel::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, var(--gold), var(--green), var(--teal));
  }
  .notice-inner {
    padding: 36px 32px 32px;
  }
  .notice-tag {
    font-size: 11px;
    letter-spacing: 0.36em;
    text-transform: uppercase;
    color: var(--gold);
    font-weight: 700;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .notice-tag::before {
    content: '';
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 0 0 rgba(245,200,66,0.6);
    animation: noticepulse 2.4s infinite;
    flex-shrink: 0;
  }
  @keyframes noticepulse {
    0%   { box-shadow: 0 0 0 0 rgba(245,200,66,0.55); }
    70%  { box-shadow: 0 0 0 8px rgba(245,200,66,0); }
    100% { box-shadow: 0 0 0 0 rgba(245,200,66,0); }
  }
  .notice-team {
    font-size: 28px;
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 16px;
    line-height: 1.1;
  }
  .notice-divider {
    width: 36px; height: 2px;
    background: linear-gradient(90deg, var(--gold), var(--green));
    border-radius: 2px;
    margin-bottom: 18px;
  }
  .notice-message {
    font-size: 17px;
    font-weight: 400;
    color: var(--ink-dim);
    line-height: 1.6;
  }
  /* ── END NOTICE PANEL ── */
  .eyebrow {
    font-size: 17px;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: var(--green);
    font-weight: 600;
    margin-bottom: 22px;
  }
  .greeting {
    font-size: 132px;
    font-weight: 200;
    line-height: 0.96;
    letter-spacing: -0.01em;
    color: var(--ink);
  }
  .greeting b {
    font-weight: 600;
    background: linear-gradient(100deg, var(--gold) 0%, var(--green) 45%, var(--teal) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .clockrow {
    display: flex;
    align-items: baseline;
    gap: 28px;
    margin-top: 38px;
  }
  .clock {
    font-size: 64px;
    font-weight: 300;
    letter-spacing: 0.02em;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }
  .ampm {
    font-size: 24px;
    font-weight: 500;
    color: var(--ink-faint);
    letter-spacing: 0.08em;
  }

  .footer {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    z-index: 3;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 38px 72px;
    border-top: 1px solid var(--hairline);
    background: linear-gradient(180deg, transparent, rgba(0,0,0,0.18));
  }
  .footer-left {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .weather-row {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .weather-icon { font-size: 26px; line-height: 1; width: 32px; text-align: center; }
  .weather-temp {
    font-size: 24px;
    font-weight: 300;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
    min-width: 64px;
  }
  .weather-location {
    font-size: 13px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin-left: 4px;
  }
  .footer-right {
    font-size: 13px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--ink-faint);
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .pulse {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 0 0 rgba(111,174,90,0.6);
    animation: pulse 2.4s infinite;
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(111,174,90,0.55); }
    70%  { box-shadow: 0 0 0 10px rgba(111,174,90,0); }
    100% { box-shadow: 0 0 0 0 rgba(111,174,90,0); }
  }
</style>
</head>

  <div class="topright">
    <div class="day" id="dayName">---</div>
    <div class="dateline" id="dateLine">---</div>
  </div>

  <div class="hero">
    <div class="eyebrow">Clarify &nbsp;&middot;&nbsp; Reading</div>
    <div class="greeting" id="greeting">Good <b>Morning</b></div>
    <div class="clockrow">
      <span class="clock" id="clock">--:--</span>
      <span class="ampm" id="ampm">--</span>
    </div>
  </div>

  <!-- NOTICE PANEL: remove this block when no longer needed -->
  <div class="notice-panel">
    <div class="notice-inner">
      <div class="notice-tag">Out of Office</div>
      <div class="notice-team">Soldo Team</div>
      <div class="notice-divider"></div>
      <div class="notice-message">On client site for pipeline generation — back tomorrow.</div>
    </div>
  </div>
  <!-- END NOTICE PANEL -->

  <div class="footer">
    <div class="footer-left">
      <div class="weather-row">
        <span class="weather-icon" id="weatherIconTheale">&#9728;&#65039;</span>
        <span class="weather-temp" id="weatherTempTheale">--&deg;C</span>
        <span class="weather-location">Theale, Reading</span>
      </div>
      <div class="weather-row">
        <span class="weather-icon" id="weatherIconTampa">&#9728;&#65039;</span>
        <span class="weather-temp" id="weatherTempTampa">--&deg;C</span>
        <span class="weather-location">Tampa, Florida</span>
      </div>
    </div>
    <div class="footer-right">
      <span class="pulse"></span>
      <span>Live</span>
    </div>
  </div>
</div>

<script>
  (function buildField() {
    var colors = ['#f5c842', '#a7c43f', '#6fae5a', '#4f9a78', '#3a8a8c'];
    var field = document.getElementById('field');
    var count = 22;
    for (var i = 0; i < count; i++) {
      var d = document.createElement('div');
      d.className = 'dot';
      var size = 3 + Math.random() * 7;
      d.style.width = size + 'px';
      d.style.height = size + 'px';
      d.style.left = Math.random() * 100 + '%';
      d.style.top = Math.random() * 100 + '%';
      d.style.background = colors[Math.floor(Math.random() * colors.length)];
      d.style.animationDelay = (Math.random() * 10) + 's';
      d.style.animationDuration = (20 + Math.random() * 14) + 's';
      d.style.opacity = (0.15 + Math.random() * 0.35).toFixed(2);
      field.appendChild(d);
    }
  })();

  function updateClock() {
    var now = new Date();
    var h = now.getHours();
    var m = now.getMinutes().toString().padStart(2,'0');
    var ampm = h >= 12 ? 'PM' : 'AM';
    var h12 = h % 12 || 12;
    document.getElementById('clock').textContent = h12 + ':' + m;
    document.getElementById('ampm').textContent = ampm;

    var greet = 'Morning';
    if (h >= 12 && h < 17) greet = 'Afternoon';
    else if (h >= 17) greet = 'Evening';
    document.getElementById('greeting').innerHTML = 'Good <b>' + greet + '</b>';

    var days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    var months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    document.getElementById('dayName').textContent = days[now.getDay()];
    document.getElementById('dateLine').textContent = months[now.getMonth()] + ' ' + now.getDate() + ', ' + now.getFullYear();
  }
  updateClock();
  setInterval(updateClock, 10000);

  function weatherIconFor(code) {
    if (code === 0) return String.fromCodePoint(0x2600, 0xFE0F);
    if (code === 1 || code === 2) return String.fromCodePoint(0x1F324, 0xFE0F);
    if (code === 3) return String.fromCodePoint(0x2601, 0xFE0F);
    if (code >= 45 && code <= 48) return String.fromCodePoint(0x1F32B, 0xFE0F);
    if (code >= 51 && code <= 67) return String.fromCodePoint(0x1F327, 0xFE0F);
    if (code >= 71 && code <= 77) return String.fromCodePoint(0x2744, 0xFE0F);
    if (code >= 80 && code <= 82) return String.fromCodePoint(0x1F326, 0xFE0F);
    if (code >= 95) return String.fromCodePoint(0x26C8, 0xFE0F);
    return String.fromCodePoint(0x1F321, 0xFE0F);
  }

  function fetchWeatherFor(lat, lon, iconId, tempId) {
    var url = 'https://api.open-meteo.com/v1/forecast?latitude=' + lat + '&longitude=' + lon + '&current=temperature_2m,weather_code&temperature_unit=celsius';
    fetch(url)
      .then(function(res) { return res.json(); })
      .then(function(data) {
        var temp = Math.round(data.current.temperature_2m);
        var code = data.current.weather_code;
        document.getElementById(tempId).textContent = temp + String.fromCharCode(176) + 'C';
        document.getElementById(iconId).textContent = weatherIconFor(code);
      })
      .catch(function(err) {
        console.log('Weather fetch failed for ' + tempId, err);
      });
  }

  function updateWeather() {
    fetchWeatherFor(51.4275, -1.0775, 'weatherIconTheale', 'weatherTempTheale'); // Theale, Reading
    fetchWeatherFor(27.9506, -82.4572, 'weatherIconTampa', 'weatherTempTampa'); // Tampa, Florida
  }
  updateWeather();
  setInterval(updateWeather, 900000);
</script>
