<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clarify Welcome Screen</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --navy-deep: #060e1a;
    --navy: #0d1b2e;
    --navy-light: #142841;
    --ink: #eef1f5;
    --ink-dim: rgba(238,241,245,0.55);
    --ink-faint: rgba(238,241,245,0.32);
    --gold: #f5c842;
    --green: #6fae5a;
    --teal: #3a8a8c;
    --hairline: rgba(238,241,245,0.12);
  }

  html, body {
    width: 100%; height: 100%;
    background: var(--navy-deep);
    font-family: 'Helvetica Neue', Arial, sans-serif;
    overflow: hidden;
    color: var(--ink);
  }

  .stage {
    position: relative;
    width: 100%; height: 100vh;
    background:
      radial-gradient(ellipse 1400px 900px at 18% 8%, rgba(58,138,140,0.16), transparent 60%),
      radial-gradient(ellipse 1200px 800px at 85% 95%, rgba(245,200,66,0.10), transparent 55%),
      linear-gradient(160deg, var(--navy-deep) 0%, var(--navy) 55%, #0a1626 100%);
    overflow: hidden;
  }

  .field { position: absolute; inset: 0; }
  .dot {
    position: absolute;
    border-radius: 50%;
    filter: blur(0.3px);
    animation: drift 26s ease-in-out infinite;
  }
  @keyframes drift {
    0%   { transform: translate(0, 0) scale(1); }
    50%  { transform: translate(14px, -22px) scale(1.08); }
    100% { transform: translate(0, 0) scale(1); }
  }

  .topbar {
    position: absolute;
    top: 64px; left: 72px;
    display: flex;
    align-items: center;
    gap: 22px;
    z-index: 3;
  }
  .topbar img {
    height: 46px;
    width: auto;
    mix-blend-mode: lighten;
  }
  .topbar .divider-v {
    width: 1px; height: 30px;
    background: var(--hairline);
  }
  .topbar .tag {
    font-size: 14px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--ink-faint);
    font-weight: 500;
  }

  .topright {
    position: absolute;
    top: 64px; right: 72px;
    text-align: right;
    z-index: 3;
  }
  .topright .day {
    font-size: 16px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-dim);
    font-weight: 500;
  }
  .topright .dateline {
    font-size: 14px;
    color: var(--ink-faint);
    margin-top: 4px;
    letter-spacing: 0.06em;
  }

  .hero {
    position: relative;
    z-index: 3;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
    padding-left: 72px;
  }
  .eyebrow {
    font-size: 17px;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: var(--green);
    font-weight: 600;
    margin-bottom: 22px;
  }
  .greeting {
    font-size: 132px;
    font-weight: 200;
    line-height: 0.96;
    letter-spacing: -0.01em;
    color: var(--ink);
  }
  .greeting b {
    font-weight: 600;
    background: linear-gradient(100deg, var(--gold) 0%, var(--green) 45%, var(--teal) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .clockrow {
    display: flex;
    align-items: baseline;
    gap: 28px;
    margin-top: 38px;
  }
  .clock {
    font-size: 64px;
    font-weight: 300;
    letter-spacing: 0.02em;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }
  .ampm {
    font-size: 24px;
    font-weight: 500;
    color: var(--ink-faint);
    letter-spacing: 0.08em;
  }

  .footer {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    z-index: 3;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 38px 72px;
    border-top: 1px solid var(--hairline);
    background: linear-gradient(180deg, transparent, rgba(0,0,0,0.18));
  }
  .footer-left {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .weather-icon { font-size: 34px; line-height: 1; }
  .weather-temp {
    font-size: 30px;
    font-weight: 300;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }
  .weather-location {
    font-size: 13px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin-left: 4px;
  }
  .footer-right {
    font-size: 13px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--ink-faint);
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .pulse {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 0 0 rgba(111,174,90,0.6);
    animation: pulse 2.4s infinite;
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(111,174,90,0.55); }
    70%  { box-shadow: 0 0 0 10px rgba(111,174,90,0); }
    100% { box-shadow: 0 0 0 0 rgba(111,174,90,0); }
  }
</style>
</head>

    <div class="tag">Welcome</div>
  </div>

  <div class="topright">
    <div class="day" id="dayName">---</div>
    <div class="dateline" id="dateLine">---</div>
  </div>

  <div class="hero">
    <div class="eyebrow">Clarify B2B &nbsp;&middot;&nbsp; Reading</div>
    <div class="greeting" id="greeting">Good <b>Morning</b></div>
    <div class="clockrow">
      <span class="clock" id="clock">--:--</span>

  </div>

  <div class="footer">
    <div class="footer-left">
      <span class="weather-icon" id="weatherIcon">&#9728;&#65039;</span>
      <span class="weather-temp" id="weatherTemp">--&deg;C</span>
      <span class="weather-location">Theale, Reading</span>
    </div>
    <div class="footer-right">

      <span>Live</span>
    </div>
  </div>
</div>

<script>
  (function buildField() {
    var colors = ['#f5c842', '#a7c43f', '#6fae5a', '#4f9a78', '#3a8a8c'];
    var field = document.getElementById('field');
    var count = 22;
    for (var i = 0; i < count; i++) {
      var d = document.createElement('div');
      d.className = 'dot';
      var size = 3 + Math.random() * 7;
      d.style.width = size + 'px';
      d.style.height = size + 'px';
      d.style.left = Math.random() * 100 + '%';
      d.style.top = Math.random() * 100 + '%';
      d.style.background = colors[Math.floor(Math.random() * colors.length)];
      d.style.animationDelay = (Math.random() * 10) + 's';
      d.style.animationDuration = (20 + Math.random() * 14) + 's';
      d.style.opacity = (0.15 + Math.random() * 0.35).toFixed(2);
      field.appendChild(d);
    }
  })();

  function updateClock() {
    var now = new Date();
    var h = now.getHours();
    var m = now.getMinutes().toString().padStart(2,'0');
    var ampm = h >= 12 ? 'PM' : 'AM';
    var h12 = h % 12 || 12;
    document.getElementById('clock').textContent = h12 + ':' + m;
    document.getElementById('ampm').textContent = ampm;

    var greet = 'Morning';
    if (h >= 12 && h < 17) greet = 'Afternoon';
    else if (h >= 17) greet = 'Evening';
    document.getElementById('greeting').innerHTML = 'Good <b>' + greet + '</b>';

    var days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    var months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    document.getElementById('dayName').textContent = days[now.getDay()];
    document.getElementById('dateLine').textContent = months[now.getMonth()] + ' ' + now.getDate() + ', ' + now.getFullYear();
  }
  updateClock();
  setInterval(updateClock, 10000);

  function weatherIconFor(code) {
    if (code === 0) return String.fromCodePoint(0x2600, 0xFE0F);
    if (code === 1 || code === 2) return String.fromCodePoint(0x1F324, 0xFE0F);
    if (code === 3) return String.fromCodePoint(0x2601, 0xFE0F);
    if (code >= 45 && code <= 48) return String.fromCodePoint(0x1F32B, 0xFE0F);
    if (code >= 51 && code <= 67) return String.fromCodePoint(0x1F327, 0xFE0F);
    if (code >= 71 && code <= 77) return String.fromCodePoint(0x2744, 0xFE0F);
    if (code >= 80 && code <= 82) return String.fromCodePoint(0x1F326, 0xFE0F);
    if (code >= 95) return String.fromCodePoint(0x26C8, 0xFE0F);
    return String.fromCodePoint(0x1F321, 0xFE0F);
  }

  function updateWeather() {
    var url = 'https://api.open-meteo.com/v1/forecast?latitude=51.4275&longitude=-1.0775&current=temperature_2m,weather_code&temperature_unit=celsius';
    fetch(url)
      .then(function(res) { return res.json(); })
      .then(function(data) {
        var temp = Math.round(data.current.temperature_2m);
        var code = data.current.weather_code;
        document.getElementById('weatherTemp').textContent = temp + String.fromCharCode(176) + 'C';
        document.getElementById('weatherIcon').textContent = weatherIconFor(code);
      })
      .catch(function(err) {
        console.log('Weather fetch failed', err);
      });
  }
  updateWeather();
  setInterval(updateWeather, 900000);
</script>
